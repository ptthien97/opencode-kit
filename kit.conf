# kit.conf — cấu hình chung cho opencode-kit (được install.sh đọc qua `source`).
# Mọi biến đều override được bằng env cùng tên (phục vụ test). Repo GitHub public
# chứa bản phát hành binary Finder (không commit binary vào git).
KIT_REPO="${KIT_REPO:-ptthien97/opencode-kit}"

# Finder binary release: tag + tên asset + sha256 trên GitHub Releases.
# Khi build finder mới: gh release create <tag> ~/.local/bin/finder#finder-darwin-arm64 -R $KIT_REPO
# rồi bump 3 biến dưới đây (sha256 lấy bằng: shasum -a 256 ~/.local/bin/finder).
FINDER_RELEASE_TAG="${FINDER_RELEASE_TAG:-finder-v1.2.4}"
FINDER_ASSET_NAME="${FINDER_ASSET_NAME:-finder-darwin-arm64}"
FINDER_VERSION="${FINDER_VERSION:-1.2.4}"
FINDER_SHA256="${FINDER_SHA256:-64685c6cf7b99fd1bf551f1946bd1f105956f19261d1859d6de7c0ef8b4cb11f}"
