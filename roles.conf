# roles.conf — nguồn dữ liệu chung về ROLE -> model cho set-model.sh, install.sh, README.
# Format: role|target|mô tả (1 dòng). target: danh sách phân tách bởi dấu phẩy, mỗi mục:
#   json:<path>   = key trong opencode.json (vd json:model, json:agents.explore.model)
#   md:<agent>    = frontmatter `model:` của agents/<agent>.md
# Role KHÔNG được trùng tên nhau. Thứ tự dòng = thứ tự hiển thị trong picker.
main|json:model|Model chính của hội thoại orchestrator (mặc định khi agent không set model) — nên là model mạnh nhất
small|json:small_model,json:agents.title.model,json:agents.summary.model,json:agents.compaction.model|Model phụ: small_model + title/summary/compaction — nên rẻ & nhanh
orchestrator|md:orchestrator|Agent điều phối: chia việc, dispatch sub-agent — nên mạnh
worker|md:worker|Worker headless của worker-kit (bị env WORKER_MODEL ghi đè lúc dispatch) — tier vừa/rẻ
junior-dev|md:junior-dev|Implementer việc nhỏ đã spec sẵn 1-2 file — nên rẻ
senior-dev|md:senior-dev|Implementer việc thường (~3 file) — tier vừa
10x-dev|md:10x-dev|Implementer việc khó, refactor nhiều file — nên mạnh
reviewer|md:reviewer|Review diff read-only, bắt bug/regression — nên mạnh
teach|md:teach|Agent dạy học 2 track (dev + lớp 5) — nên mạnh
explore|json:agents.explore.model|Agent khám phá code read-only — nên rẻ
general|json:agents.general.model|Agent đa dụng research + thực thi nhiều bước — tier vừa/rẻ
